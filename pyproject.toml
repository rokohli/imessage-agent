[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imessage-agent"
version = "0.1.0"
description = "Read-only macOS ingestion and disabled-by-default controlled iMessage transport"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dashboard = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imessage_agent = ["Notifier.swift"]
